name: Dutch Vocabulary Trainer V2.4 tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-tests:
    name: Self tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run V2.4 self-tests
        run: node tests/v2.4-self-tests.js

  browser-smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    needs: self-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright for CI
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local web server
        run: python3 -m http.server 8000 > /tmp/dvt-http.log 2>&1 &
      - name: Run browser smoke test
        run: node tests/v2.4-browser-smoke.cjs
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/dvt-http.log || true
